name: Enviar tradução comunitária
description: Compartilhe um patch JSON exportado pelo Live Translator.
title: "[Community Patch] "
labels:
  - live-translator-patch
body:
  - type: markdown
    attributes:
      value: |
        ## Live Translator • envio comunitário

        Anexe o arquivo `.json` exportado pelo Live Translator.

        O próprio arquivo já contém o mod, a versão, o idioma e as traduções.
        Você não precisa preencher essas informações manualmente.

  - type: upload
    id: patchFile
    attributes:
      label: Patch do Live Translator
      description: Selecione o arquivo .json exportado pelo mod.
    validations:
      required: true
      accept: ".json"

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmação
      options:
        - label: Confirmo que quero compartilhar este patch com a comunidade.
          required: true
