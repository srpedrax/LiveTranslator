name: Enviar tradução comunitária
description: Envie um patch JSON do Live Translator para a comunidade.
title: "[Community Patch] "
labels:
  - live-translator-patch
body:
  - type: markdown
    attributes:
      value: |
        ## Live Translator • envio comunitário

        Envie seu patch de tradução em JSON.
        O arquivo continuará anexado a esta Issue e poderá ser encontrado pelo Live Translator.

  - type: input
    id: modName
    attributes:
      label: Mod
      description: Nome interno ou nome principal do mod.
      placeholder: PathOfTerraria
    validations:
      required: true

  - type: input
    id: modVersion
    attributes:
      label: Versão do mod
      description: Opcional. Informe a versão para ajudar na compatibilidade.
      placeholder: 0.3.13
    validations:
      required: false

  - type: dropdown
    id: language
    attributes:
      label: Idioma
      description: Idioma de destino do patch.
      options:
        - pt-BR
        - en-US
        - es-ES
        - fr-FR
        - de-DE
        - it-IT
        - nl-NL
        - pl-PL
        - ru-RU
        - tr-TR
        - ja-JP
        - ko-KR
        - zh-CN
        - id-ID
    validations:
      required: true

  - type: upload
    id: patchFile
    attributes:
      label: Arquivo JSON
      description: Selecione o arquivo .json exportado pelo Live Translator.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmação
      options:
        - label: Confirmo que este arquivo é um patch de tradução do Live Translator.
          required: true
