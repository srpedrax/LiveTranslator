name: Auto Publish Community Patch

on:
  workflow_run:
    workflows: ["Validate Community Patch"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # SECURITY:
      # We deliberately DO NOT checkout or execute code from the contributor.
      # The JSON is fetched through the GitHub API and parsed strictly as data.
      - name: Revalidate untrusted submission with privileged workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/validate_community_patch.py \
            --repo "${{ github.repository }}" \
            --expected-sha "${{ github.event.workflow_run.head_sha }}" \
            --result validation-result.json

      - name: Publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/merge_community_patch.py \
            --repo "${{ github.repository }}" \
            --result validation-result.json
